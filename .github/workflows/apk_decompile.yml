name: APK Download Decompile and Push Report

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK download URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------
      # 1. Checkout repository
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ---------------------------------------
      # 2. Setup Java
      # ---------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------
      # 3. Prepare folders
      # ---------------------------------------
      - name: Prepare folders
        run: |
          set -e

          mkdir -p input
          mkdir -p tools
          mkdir -p report


      # ---------------------------------------
      # 4. Download latest APKTool
      # ---------------------------------------
      - name: Download APKTool
        run: |
          set -e

          APKTOOL_URL=$(python3 - <<'PY'
          import json
          import urllib.request

          api = "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          req = urllib.request.Request(
              api,
              headers={
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          for asset in data.get("assets", []):
              name = asset.get("name", "").lower()

              if name.endswith(".jar") and "apktool" in name:
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("APKTool JAR not found.")
          PY
          )

          echo "APKTool URL:"
          echo "$APKTOOL_URL"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$APKTOOL_URL" \
            -o tools/apktool.jar

          test -s tools/apktool.jar

          echo "APKTool version:"
          java -jar tools/apktool.jar --version


      # ---------------------------------------
      # 5. Download APK
      # ---------------------------------------
      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -e

          echo "Downloading APK..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "Mozilla/5.0" \
            "$APK_URL" \
            -o input/source.apk

          echo ""
          echo "Downloaded file:"
          ls -lh input/source.apk

          echo ""
          echo "File type:"
          file input/source.apk

          test -s input/source.apk


      # ---------------------------------------
      # 6. Verify APK
      # ---------------------------------------
      - name: Verify APK
        run: |
          set -e

          python3 - <<'PY'
          import zipfile
          import sys

          apk = "input/source.apk"

          if not zipfile.is_zipfile(apk):
              print("ERROR: Downloaded file is not a valid APK.")
              sys.exit(1)

          print("Valid APK detected.")
          PY


      # ---------------------------------------
      # 7. Decompile APK
      # ---------------------------------------
      - name: Decompile APK
        run: |
          set -e

          rm -rf report/*

          java -jar tools/apktool.jar \
            d input/source.apk \
            -o report \
            --force

          echo ""
          echo "======================================"
          echo "DECOMPILE SUCCESS"
          echo "======================================"

          echo ""
          echo "Report contents:"
          find report -maxdepth 2 -type f | head -100


      # ---------------------------------------
      # 8. Remove temporary files
      # ---------------------------------------
      - name: Cleanup
        run: |
          rm -rf input
          rm -rf tools

          echo "Temporary files removed."


      # ---------------------------------------
      # 9. Git status
      # ---------------------------------------
      - name: Check changes
        run: |
          git status --short


      # ---------------------------------------
      # 10. Commit and push report
      # ---------------------------------------
      - name: Commit and push report
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A report/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Update APK decompile report"

          git push


      # ---------------------------------------
      # 11. Summary
      # ---------------------------------------
      - name: Complete
        run: |
          echo "======================================"
          echo "DONE"
          echo "======================================"
          echo ""
          echo "Decompiled APK has been committed"
          echo "and pushed to the report/ folder."
