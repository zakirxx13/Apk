name: Authorized APK Mod Builder

on:
  workflow_dispatch:
    inputs:

      apk_url:
        description: "Direct URL of your authorized APK"
        required: true
        type: string

      new_package:
        description: "New package name"
        required: true
        default: "com.example.modified"
        type: string

      app_name:
        description: "New application name"
        required: true
        default: "Modified App"
        type: string

      find_text:
        description: "Text to replace"
        required: false
        default: ""
        type: string

      replace_text:
        description: "Replacement text"
        required: false
        default: ""
        type: string


permissions:
  contents: read


jobs:

  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. PYTHON
      # ==========================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 4. CREATE DIRECTORIES
      # ==========================================================

      - name: Create directories
        run: |
          set -e

          mkdir -p input
          mkdir -p output
          mkdir -p tools

          echo "Directories created."


      # ==========================================================
      # 5. DOWNLOAD APKTOOL
      # ==========================================================

      - name: Download latest APKTool
        run: |
          set -e

          echo "Finding latest APKTool release..."

          APKTOOL_URL=$(python3 - <<'PY'
          import json
          import urllib.request

          api = "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          request = urllib.request.Request(
              api,
              headers={
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          found = None

          for asset in data.get("assets", []):
              name = asset.get("name", "").lower()

              if name.endswith(".jar") and "apktool" in name:
                  found = asset["browser_download_url"]
                  break

          if not found:
              raise SystemExit(
                  "Could not find APKTool JAR."
              )

          print(found)
          PY
          )

          echo ""
          echo "APKTool URL:"
          echo "$APKTOOL_URL"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$APKTOOL_URL" \
            -o apktool.jar

          echo ""
          echo "APKTool file:"
          ls -lh apktool.jar

          echo ""
          echo "File type:"
          file apktool.jar

          echo ""
          echo "APKTool version:"
          java -jar apktool.jar --version


      # ==========================================================
      # 6. DOWNLOAD AUTHORIZED APK
      # ==========================================================

      - name: Download authorized APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -e

          echo "Downloading APK..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "Mozilla/5.0" \
            "$APK_URL" \
            -o input/source.apk

          echo ""
          echo "Downloaded file:"
          ls -lh input/source.apk

          echo ""
          echo "File type:"
          file input/source.apk

          test -s input/source.apk


      # ==========================================================
      # 7. VERIFY DOWNLOADED APK
      # ==========================================================

      - name: Verify downloaded APK
        run: |
          set -e

          python3 - <<'PY'
          import zipfile

          apk = "input/source.apk"

          if not zipfile.is_zipfile(apk):
              raise SystemExit(
                  "ERROR: Downloaded file is not a valid APK."
              )

          print("OK: Valid APK detected.")
          PY


      # ==========================================================
      # 8. DECODE APK
      # ==========================================================

      - name: Decode APK
        run: |
          set -e

          echo "Decoding APK..."

          java -jar apktool.jar \
            d input/source.apk \
            -o decoded \
            --force

          echo ""
          echo "APK decode completed."


      # ==========================================================
      # 9. DETECT ORIGINAL PACKAGE
      # ==========================================================

      - name: Detect original package
        run: |
          set -e

          python3 - <<'PY'
          import re

          manifest = "decoded/AndroidManifest.xml"

          with open(
              manifest,
              "r",
              encoding="utf-8"
          ) as f:
              data = f.read()

          match = re.search(
              r'<manifest[^>]*\bpackage="([^"]+)"',
              data
          )

          if not match:
              raise SystemExit(
                  "Could not detect original package."
              )

          print(
              "Original package:",
              match.group(1)
          )
          PY


      # ==========================================================
      # 10. PACKAGE MODIFIER
      # ==========================================================

      - name: Create package modifier
        run: |
          cat > tools/package_modifier.py <<'PY'
          import os
          import re

          decoded = "decoded"

          new_package = os.environ[
              "NEW_PACKAGE"
          ]

          package_pattern = (
              r"^[A-Za-z][A-Za-z0-9_]*"
              r"(\.[A-Za-z][A-Za-z0-9_]*)+$"
          )

          if not re.match(
              package_pattern,
              new_package
          ):
              raise SystemExit(
                  "Invalid package name: "
                  + new_package
              )

          manifest = os.path.join(
              decoded,
              "AndroidManifest.xml"
          )

          with open(
              manifest,
              "r",
              encoding="utf-8"
          ) as f:
              manifest_text = f.read()

          match = re.search(
              r'<manifest[^>]*\bpackage="([^"]+)"',
              manifest_text
          )

          if not match:
              raise SystemExit(
                  "Original package not found."
              )

          old_package = match.group(1)

          print(
              "Old package:",
              old_package
          )

          print(
              "New package:",
              new_package
          )

          if old_package == new_package:
              print(
                  "Package already matches."
              )
              raise SystemExit(0)

          # ------------------------------------------------------
          # Replace package references in text files
          # ------------------------------------------------------

          changed = 0

          for root, dirs, files in os.walk(
              decoded
          ):

              for filename in files:

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          content = f.read()

                  except (
                      UnicodeDecodeError,
                      PermissionError
                  ):
                      continue

                  if old_package in content:

                      new_content = content.replace(
                          old_package,
                          new_package
                      )

                      if new_content != content:

                          with open(
                              path,
                              "w",
                              encoding="utf-8"
                          ) as f:
                              f.write(
                                  new_content
                              )

                          changed += 1

          # ------------------------------------------------------
          # Update manifest
          # ------------------------------------------------------

          manifest_text = manifest_text.replace(
              f'package="{old_package}"',
              f'package="{new_package}"',
              1
          )

          with open(
              manifest,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(manifest_text)

          print(
              "Text files changed:",
              changed
          )

          print(
              "Package modification completed."
          )
          PY


      # ==========================================================
      # 11. CHANGE PACKAGE
      # ==========================================================

      - name: Change package name
        env:
          NEW_PACKAGE: ${{ inputs.new_package }}
        run: |
          set -e

          python3 tools/package_modifier.py


      # ==========================================================
      # 12. CHANGE APP NAME
      # ==========================================================

      - name: Change application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re

          decoded = "decoded"

          app_name = os.environ[
              "APP_NAME"
          ]

          manifest = os.path.join(
              decoded,
              "AndroidManifest.xml"
          )

          with open(
              manifest,
              "r",
              encoding="utf-8"
          ) as f:
              data = f.read()

          # ------------------------------------------------------
          # Literal android:label
          # ------------------------------------------------------

          data = re.sub(
              r'android:label="[^"]*"',
              f'android:label="{app_name}"',
              data,
              count=1
          )

          with open(
              manifest,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data)

          # ------------------------------------------------------
          # app_name string resource
          # ------------------------------------------------------

          res_dir = os.path.join(
              decoded,
              "res"
          )

          if os.path.exists(res_dir):

              for root, dirs, files in os.walk(
                  res_dir
              ):

                  for filename in files:

                      if filename != "strings.xml":
                          continue

                      path = os.path.join(
                          root,
                          filename
                      )

                      try:
                          with open(
                              path,
                              "r",
                              encoding="utf-8"
                          ) as f:
                              text = f.read()

                      except UnicodeDecodeError:
                          continue

                      new_text = re.sub(
                          r'(<string\s+name="app_name"[^>]*>)'
                          r'.*?'
                          r'(</string>)',
                          r'\g<1>'
                          + app_name
                          + r'\g<2>',
                          text,
                          flags=re.DOTALL
                      )

                      if new_text != text:

                          with open(
                              path,
                              "w",
                              encoding="utf-8"
                          ) as f:
                              f.write(
                                  new_text
                              )

          print(
              "Application name changed to:",
              app_name
          )
          PY


      # ==========================================================
      # 13. TEXT REPLACEMENT
      # ==========================================================

      - name: Replace text
        env:
          FIND_TEXT: ${{ inputs.find_text }}
          REPLACE_TEXT: ${{ inputs.replace_text }}
        run: |
          set -e

          if [ -z "$FIND_TEXT" ]; then
            echo "No text replacement requested."
            exit 0
          fi

          python3 - <<'PY'
          import os

          find_text = os.environ[
              "FIND_TEXT"
          ]

          replace_text = os.environ[
              "REPLACE_TEXT"
          ]

          changed = 0

          for root, dirs, files in os.walk(
              "decoded"
          ):

              for filename in files:

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          data = f.read()

                  except (
                      UnicodeDecodeError,
                      PermissionError
                  ):
                      continue

                  if find_text not in data:
                      continue

                  new_data = data.replace(
                      find_text,
                      replace_text
                  )

                  if new_data != data:

                      with open(
                          path,
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(
                              new_data
                          )

                      changed += 1

          print(
              "Files changed:",
              changed
          )
          PY


      # ==========================================================
      # 14. INSPECT MODIFIED PROJECT
      # ==========================================================

      - name: Inspect modified project
        run: |
          echo ""
          echo "=========================================="
          echo "MODIFIED MANIFEST"
          echo "=========================================="

          grep -m 1 \
            '<manifest' \
            decoded/AndroidManifest.xml || true

          echo ""
          echo "=========================================="
          echo "SMALI DIRECTORIES"
          echo "=========================================="

          find decoded \
            -maxdepth 1 \
            -type d \
            -name "smali*" \
            -print || true

          echo ""
          echo "=========================================="
          echo "RESOURCE DIRECTORIES"
          echo "=========================================="

          find decoded/res \
            -maxdepth 1 \
            -type d \
            -print || true


      # ==========================================================
      # 15. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # 16. INSTALL ONLY REQUIRED PACKAGES
      # ==========================================================

      - name: Install Android Build Tools
        run: |
          set -e

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installing required packages..."

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo ""
          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing platform-tools..."

          "$SDKMANAGER" \
            "platform-tools"

          echo ""
          echo "Installing build-tools..."

          "$SDKMANAGER" \
            "build-tools;35.0.0"

          echo ""
          echo "Build tools installed."

          ls -la \
            "$ANDROID_HOME/build-tools/35.0.0"


      # ==========================================================
      # 17. VERIFY APKSIGNER
      # ==========================================================

      - name: Verify apksigner
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "apksigner found:"
          echo "$APKSIGNER"

          echo ""
          "$APKSIGNER" version


      # ==========================================================
      # 18. REBUILD APK
      # ==========================================================

      - name: Rebuild APK
        run: |
          set -e

          echo "Rebuilding APK..."

          java -jar apktool.jar \
            b decoded \
            -o output/unsigned.apk

          test -s output/unsigned.apk

          echo ""
          echo "Unsigned APK:"
          ls -lh output/unsigned.apk


      # ==========================================================
      # 19. CREATE TEMPORARY SIGNING KEY
      # ==========================================================

      - name: Create signing key
        run: |
          set -e

          keytool \
            -genkeypair \
            -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname \
            "CN=Authorized APK Builder, OU=Build, O=Local, L=Dhaka, ST=Dhaka, C=BD"

          echo ""
          echo "Signing key created."


      # ==========================================================
      # 20. SIGN APK
      # ==========================================================

      - name: Sign APK
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/modified.apk \
            output/unsigned.apk

          echo ""
          echo "Signed APK:"
          ls -lh output/modified.apk


      # ==========================================================
      # 21. VERIFY SIGNATURE
      # ==========================================================

      - name: Verify APK signature
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            output/modified.apk

          echo ""
          echo "APK signature verification successful."


      # ==========================================================
      # 22. VERIFY FINAL APK
      # ==========================================================

      - name: Verify final APK
        run: |
          set -e

          python3 - <<'PY'
          import zipfile

          apk = "output/modified.apk"

          if not zipfile.is_zipfile(apk):
              raise SystemExit(
                  "Final APK is not a valid APK."
              )

          print(
              "Final APK is valid."
          )
          PY

          echo ""
          file output/modified.apk

          echo ""
          ls -lh output/modified.apk


      # ==========================================================
      # 23. CREATE DECODED PROJECT ZIP
      # ==========================================================

      - name: Archive decoded project
        run: |
          set -e

          cd decoded

          zip -qr \
            ../output/decoded-apk-project.zip \
            .

          cd ..

          echo ""
          ls -lh \
            output/decoded-apk-project.zip


      # ==========================================================
      # 24. UPLOAD MODIFIED APK
      # ==========================================================

      - name: Upload modified APK
        uses: actions/upload-artifact@v4
        with:
          name: modified-apk
          path: output/modified.apk
          if-no-files-found: error


      # ==========================================================
      # 25. UPLOAD DECODED PROJECT
      # ==========================================================

      - name: Upload decoded project
        uses: actions/upload-artifact@v4
        with:
          name: decoded-apk-project
          path: output/decoded-apk-project.zip
          if-no-files-found: error


      # ==========================================================
      # 26. SUMMARY
      # ==========================================================

      - name: Build summary
        run: |
          echo ""
          echo "=============================================="
          echo "              BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "APK:"
          echo "output/modified.apk"
          echo ""
          echo "Package:"
          echo "${{ inputs.new_package }}"
          echo ""
          echo "App name:"
          echo "${{ inputs.app_name }}"
          echo ""
          echo "Artifacts:"
          echo "  modified-apk"
          echo "  decoded-apk-project"
          echo ""
          echo "=============================================="
