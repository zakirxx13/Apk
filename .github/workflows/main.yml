name: IPTV Connection Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      IPTV_HOST: "http://gott-smart.net:80"

    steps:
      - name: Check tools
        shell: bash
        run: |
          set -euo pipefail
          curl --version
          python3 --version

      - name: Diagnose DNS
        shell: bash
        run: |
          set -uo pipefail

          HOST="${IPTV_HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"

          echo "Checking DNS for configured hostname..."

          if getent ahosts "$HOST"; then
            echo "DNS lookup completed."
          else
            echo "::warning::DNS lookup failed."
          fi

      - name: Test documented HTTP and HTTPS endpoints
        shell: bash
        run: |
          set -uo pipefail

          for URL in \
            "http://gott-smart.net:80/" \
            "https://gott-smart.net/"; do

            echo ""
            echo "Testing endpoint: $URL"

            if curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output /dev/null \
              --write-out \
              'HTTP status: %{http_code}\nRemote IP: %{remote_ip}\n' \
              "$URL"; then

              echo "Connection request completed."
            else
              RESULT=$?
              echo "Request failed with curl exit code: $RESULT"
            fi
          done

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          echo "Diagnostics completed."
          echo "Review the preceding output for DNS, protocol, and connection errors."
          echo "A successful root-page request does not guarantee API availability."
