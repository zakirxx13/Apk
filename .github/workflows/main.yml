<?php

$host = 'http://gott-smart.net:80';
$username = 'MAG2UHMP6K';
$password = '2poLclRsIj';

$outDir = __DIR__ . '/output';

if (!is_dir($outDir)) {
    mkdir($outDir, 0755, true);
}

function apiGet($url) {
    $ch = curl_init($url);

    curl_setopt_array($ch, [
        CURLOPT_RETURNTRANSFER => true,
        CURLOPT_FOLLOWLOCATION => true,
        CURLOPT_CONNECTTIMEOUT => 15,
        CURLOPT_TIMEOUT => 60,
        CURLOPT_USERAGENT => 'Mozilla/5.0',
        CURLOPT_HTTPHEADER => [
            'Accept: application/json'
        ]
    ]);

    $response = curl_exec($ch);
    $error = curl_error($ch);
    $code = curl_getinfo($ch, CURLINFO_HTTP_CODE);

    curl_close($ch);

    if ($response === false || $code >= 400) {
        throw new Exception("HTTP/API error: " . $code . " " . $error);
    }

    $data = json_decode($response, true);

    if (!is_array($data)) {
        throw new Exception("Invalid JSON response");
    }

    return $data;
}

function buildUrl($host, $username, $password, $action = '') {
    $url = rtrim($host, '/') .
        '/player_api.php?username=' .
        rawurlencode($username) .
        '&password=' .
        rawurlencode($password);

    if ($action !== '') {
        $url .= '&action=' . rawurlencode($action);
    }

    return $url;
}

function clean($value) {
    return trim((string)$value);
}

function addM3UItem(&$m3u, $item) {

    $name = clean(
        $item['name'] ??
        $item['title'] ??
        $item['stream_display_name'] ??
        'Unknown'
    );

    $logo = clean(
        $item['stream_icon'] ??
        $item['cover'] ??
        $item['cover_big'] ??
        ''
    );

    $category = clean(
        $item['category_name'] ??
        $item['category'] ??
        ''
    );

    $id = clean(
        $item['stream_id'] ??
        $item['id'] ??
        ''
    );

    $url = clean(
        $item['stream_url'] ??
        $item['url'] ??
        ''
    );

    if ($url === '') {
        return;
    }

    $m3u .= '#EXTINF:-1';

    if ($id !== '') {
        $m3u .= ' tvg-id="' . htmlspecialchars($id, ENT_QUOTES) . '"';
    }

    if ($logo !== '') {
        $m3u .= ' tvg-logo="' . htmlspecialchars($logo, ENT_QUOTES) . '"';
    }

    if ($category !== '') {
        $m3u .= ' group-title="' . htmlspecialchars($category, ENT_QUOTES) . '"';
    }

    $m3u .= ',' . str_replace(["\r", "\n"], '', $name) . "\n";
    $m3u .= $url . "\n\n";
}

try {

    /*
     * Authentication / account information
     */
    $auth = apiGet(
        buildUrl($host, $username, $password)
    );

    if (isset($auth['user_info']['auth']) &&
        (int)$auth['user_info']['auth'] !== 1) {

        throw new Exception('Authentication failed');
    }

    /*
     * Fetch categories
     */
    $liveCategories = apiGet(
        buildUrl(
            $host,
            $username,
            $password,
            'get_live_categories'
        )
    );

    $vodCategories = apiGet(
        buildUrl(
            $host,
            $username,
            $password,
            'get_vod_categories'
        )
    );

    $seriesCategories = apiGet(
        buildUrl(
            $host,
            $username,
            $password,
            'get_series_categories'
        )
    );

    /*
     * Fetch streams
     */
    $live = apiGet(
        buildUrl(
            $host,
            $username,
            $password,
            'get_live_streams'
        )
    );

    $vod = apiGet(
        buildUrl(
            $host,
            $username,
            $password,
            'get_vod_streams'
        )
    );

    $series = apiGet(
        buildUrl(
            $host,
            $username,
            $password,
            'get_series'
        )
    );

    /*
     * Normalize data
     */
    $records = [];

    foreach ($live as $item) {
        $records[] = [
            'type' => 'live',
            'id' => $item['stream_id'] ?? null,
            'name' => $item['name'] ?? '',
            'logo' => $item['stream_icon'] ?? '',
            'category_id' => $item['category_id'] ?? '',
            'category' => $item['category_name'] ?? '',
            'url' => $item['stream_url'] ?? '',
            'raw' => $item
        ];
    }

    foreach ($vod as $item) {

        $streamId = $item['stream_id'] ?? '';

        $url = '';

        if ($streamId !== '') {
            $url =
                rtrim($host, '/') .
                '/movie/' .
                rawurlencode($username) .
                '/' .
                rawurlencode($password) .
                '/' .
                rawurlencode($streamId) .
                '.mp4';
        }

        $records[] = [
            'type' => 'vod',
            'id' => $streamId,
            'name' => $item['name'] ?? '',
            'logo' => $item['stream_icon'] ?? ($item['cover'] ?? ''),
            'category_id' => $item['category_id'] ?? '',
            'category' => $item['category_name'] ?? '',
            'url' => $url,
            'raw' => $item
        ];
    }

    foreach ($series as $item) {

        $records[] = [
            'type' => 'series',
            'id' => $item['series_id'] ?? '',
            'name' => $item['name'] ?? '',
            'logo' => $item['cover'] ?? '',
            'category_id' => $item['category_id'] ?? '',
            'category' => $item['category_name'] ?? '',
            'url' => '',
            'raw' => $item
        ];
    }

    /*
     * Remove duplicates
     */
    $unique = [];

    foreach ($records as $record) {

        $key = strtolower(
            $record['type'] . '|' .
            $record['id'] . '|' .
            $record['name']
        );

        $unique[$key] = $record;
    }

    $records = array_values($unique);

    /*
     * Standard M3U
     */
    $m3u = "#EXTM3U\n\n";

    foreach ($records as $record) {

        if ($record['url'] === '') {
            continue;
        }

        addM3UItem($m3u, [
            'name' => $record['name'],
            'stream_icon' => $record['logo'],
            'category_name' => $record['category'],
            'stream_id' => $record['id'],
            'stream_url' => $record['url']
        ]);
    }

    /*
     * JSON data
     */
    $jsonData = [
        'generated_at' => date('c'),
        'source' => $host,
        'total' => count($records),
        'items' => $records
    ];

    $json = json_encode(
        $jsonData,
        JSON_PRETTY_PRINT |
        JSON_UNESCAPED_SLASHES |
        JSON_UNESCAPED_UNICODE
    );

    /*
     * Save files
     */
    file_put_contents(
        $outDir . '/playlist.m3u',
        $m3u
    );

    file_put_contents(
        $outDir . '/playlist-json.m3u',
        $json
    );

    /*
     * Also save raw normalized JSON
     */
    file_put_contents(
        $outDir . '/catalog.json',
        $json
    );

    header('Content-Type: application/json');

    echo json_encode([
        'success' => true,
        'message' => 'Export completed',
        'total_items' => count($records),
        'files' => [
            'playlist.m3u',
            'playlist-json.m3u',
            'catalog.json'
        ]
    ], JSON_PRETTY_PRINT);

} catch (Throwable $e) {

    http_response_code(500);

    header('Content-Type: application/json');

    echo json_encode([
        'success' => false,
        'error' => $e->getMessage()
    ], JSON_PRETTY_PRINT);
}
