name: APK Static API Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            unzip \
            grep \
            binutils \
            file \
            python3

      - name: Download APK
        run: |
          mkdir -p work/apk

          wget \
            --https-only \
            --timeout=60 \
            --tries=3 \
            --show-progress \
            -O work/apk/app.apk \
            "https://sport-zfy.com/wp-content/apk/Sportzfy_v32.0.apk"

          file work/apk/app.apk
          ls -lh work/apk/app.apk

      - name: Validate APK
        run: |
          unzip -t work/apk/app.apk > /dev/null
          echo "APK archive is valid."

      - name: Download JADX
        run: |
          mkdir -p work/tools

          JADX_VERSION="1.5.3"

          wget -q \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
            -O work/tools/jadx.zip

          mkdir -p work/tools/jadx

          unzip -q \
            work/tools/jadx.zip \
            -d work/tools/jadx

          chmod +x work/tools/jadx/bin/jadx

          ./work/tools/jadx/bin/jadx --version

      - name: Extract APK
        run: |
          mkdir -p work/decoded

          unzip -q \
            work/apk/app.apk \
            -d work/decoded

      - name: Decompile APK
        run: |
          mkdir -p work/source

          ./work/tools/jadx/bin/jadx \
            --output-dir work/source \
            work/apk/app.apk \
            || true

      - name: Create report directory
        run: |
          mkdir -p report

      - name: Extract HTTP HTTPS URLs
        run: |
          {
            echo "========================================"
            echo "HTTP / HTTPS URLS"
            echo "========================================"
            echo

            grep -RhoE \
              'https?://[^"'\''<>[:space:]]+' \
              work/source work/decoded 2>/dev/null \
              | sed 's/[),;}]$//' \
              | sort -u \
              || true

          } > report/http-https-urls.txt

      - name: Extract WebSocket URLs
        run: |
          {
            echo "========================================"
            echo "WEBSOCKET URLS"
            echo "========================================"
            echo

            grep -RhoE \
              'wss?://[^"'\''<>[:space:]]+' \
              work/source work/decoded 2>/dev/null \
              | sed 's/[),;}]$//' \
              | sort -u \
              || true

          } > report/websocket-urls.txt

      - name: Extract API paths
        run: |
          {
            echo "========================================"
            echo "API-LIKE PATHS"
            echo "========================================"
            echo

            grep -RhoE \
              '["'\''][^"'\'']*/(api|api/v[0-9]+|v[0-9]+|graphql|rest)/[^"'\'']*["'\'']' \
              work/source work/decoded 2>/dev/null \
              | sort -u \
              || true

          } > report/api-paths.txt

      - name: Extract hostnames
        run: |
          {
            echo "========================================"
            echo "HOSTNAMES"
            echo "========================================"
            echo

            grep -RhoE \
              'https?://[^/"'\''<>[:space:]]+' \
              work/source work/decoded 2>/dev/null \
              | sed -E 's#https?://##' \
              | sed 's/:.*//' \
              | sort -u \
              || true

          } > report/hostnames.txt

      - name: Detect networking libraries
        run: |
          {
            echo "========================================"
            echo "NETWORKING REFERENCES"
            echo "========================================"
            echo

            grep -RniE \
              'Retrofit|OkHttp|Volley|HttpURLConnection|URLConnection|WebView|GraphQL|Firebase|Supabase|Cronet' \
              work/source 2>/dev/null \
              | head -n 1000 \
              || true

          } > report/networking-references.txt

      - name: Scan native libraries
        run: |
          {
            echo "========================================"
            echo "NATIVE LIBRARY URL SCAN"
            echo "========================================"
            echo

            find work/decoded \
              -type f \
              -name "*.so" \
              -print0 |
            while IFS= read -r -d '' lib; do

              echo
              echo "----------------------------------------"
              echo "FILE: $lib"
              echo "----------------------------------------"

              strings "$lib" 2>/dev/null |
                grep -E \
                  'https?://|wss?://|/api/|/v[0-9]+/' |
                sort -u \
                || true

            done

          } > report/native-library-scan.txt

      - name: Scan DEX files
        run: |
          {
            echo "========================================"
            echo "DEX URL SCAN"
            echo "========================================"
            echo

            find work/decoded \
              -type f \
              -name "*.dex" \
              -print0 |
            while IFS= read -r -d '' dex; do

              echo
              echo "----------------------------------------"
              echo "FILE: $dex"
              echo "----------------------------------------"

              strings "$dex" 2>/dev/null |
                grep -E \
                  'https?://|wss?://|/api/|/v[0-9]+/' |
                sort -u \
                || true

            done

          } > report/dex-scan.txt

      - name: APK information
        run: |
          {
            echo "========================================"
            echo "APK INFORMATION"
            echo "========================================"
            echo

            echo "File:"
            file work/apk/app.apk

            echo
            echo "Size:"
            du -h work/apk/app.apk

            echo
            echo "Extracted files:"
            find work/decoded \
              -maxdepth 2 \
              -type f \
              | sort \
              | head -n 500

          } > report/apk-information.txt

      - name: Create API-SUMMARY.md
        run: |
          mkdir -p docs

          cat > docs/API-SUMMARY.md <<'EOF'
          # APK API Static Analysis

          > Automatically generated by GitHub Actions.

          ## APK

          - Source: `https://sport-zfy.com/wp-content/apk/Sportzfy_v32.0.apk`
          - Analysis type: Static APK analysis
          - Android emulator: Not used

          ## HTTP / HTTPS URLs

          ```text
          EOF

          cat report/http-https-urls.txt >> docs/API-SUMMARY.md

          cat >> docs/API-SUMMARY.md <<'EOF'
          ```

          ## WebSocket URLs

          ```text
          EOF

          cat report/websocket-urls.txt >> docs/API-SUMMARY.md

          cat >> docs/API-SUMMARY.md <<'EOF'
          ```

          ## API-like Paths

          ```text
          EOF

          cat report/api-paths.txt >> docs/API-SUMMARY.md

          cat >> docs/API-SUMMARY.md <<'EOF'
          ```

          ## Hostnames

          ```text
          EOF

          cat report/hostnames.txt >> docs/API-SUMMARY.md

          cat >> docs/API-SUMMARY.md <<'EOF'
          ```

          ## Networking Libraries / References

          ```text
          EOF

          cat report/networking-references.txt >> docs/API-SUMMARY.md

          cat >> docs/API-SUMMARY.md <<'EOF'
          ```

          ## Native Library Findings

          ```text
          EOF

          cat report/native-library-scan.txt >> docs/API-SUMMARY.md

          cat >> docs/API-SUMMARY.md <<'EOF'
          ```

          ## DEX Findings

          ```text
          EOF

          cat report/dex-scan.txt >> docs/API-SUMMARY.md

          cat >> docs/API-SUMMARY.md <<'EOF'
          ```

          ## Important

          This is a static analysis report. It does not guarantee that every
          runtime API request used by the application has been discovered.

          Dynamically generated endpoints, encrypted configuration, runtime-only
          URLs, authenticated requests, or requests created after application
          startup may not appear in this report.
          EOF

      - name: Show generated summary
        run: |
          echo "========================================"
          echo "API-SUMMARY.md"
          echo "========================================"

          cat docs/API-SUMMARY.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: apk-static-analysis-report
          path: |
            report/
            docs/API-SUMMARY.md
          retention-days: 7

      - name: Commit and push summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/API-SUMMARY.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: update APK API summary"

          git push
