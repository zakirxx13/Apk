name: IPTV Server Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      IPTV_HOST: "http://gott-smart.net"
      IPTV_PORT: "80"
      IPTV_BASE_URL: "http://gott-smart.net:80"

    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Host: $IPTV_HOST"
          echo "Port: $IPTV_PORT"
          echo "Base URL: $IPTV_BASE_URL"

      - name: Check DNS
        shell: bash
        run: |
          set -uo pipefail

          if getent ahosts gott-smart.net; then
            echo "DNS resolution successful."
          else
            echo "::error::DNS resolution failed."
            exit 1
          fi

      - name: Test HTTP connectivity
        shell: bash
        run: |
          set -uo pipefail

          echo "Testing HTTP endpoint..."

          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"

            if curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output /tmp/response.txt \
              --write-out \
              'HTTP status: %{http_code}\nRemote IP: %{remote_ip}\n' \
              "$IPTV_BASE_URL/"; then

              echo "HTTP request completed."
              exit 0
            else
              result=$?
              echo "Request failed with curl exit code: $result"
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "::error::HTTP connection failed after 3 attempts."
          echo "Check the server service, port and network access."
          exit 1

      - name: Report result
        if: always()
        shell: bash
        run: |
          echo "Diagnostic workflow finished."
          echo "Review previous steps for the exact connection error."
