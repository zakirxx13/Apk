name: IPTV Exporter

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run exporter script
        env:
          IPTV_HOST: ${{ secrets.IPTV_HOST }}
          IPTV_USERNAME: ${{ secrets.IPTV_USERNAME }}
          IPTV_PASSWORD: ${{ secrets.IPTV_PASSWORD }}
        run: |
          python exporter.py

      - name: Verify generated files
        run: |
          echo "Verifying files exist..."
          test -f output/playlist.m3u
          test -f output/playlist-json.m3u
          test -f output/catalog.json

          echo "Verifying playlist.m3u starts with #EXTM3U..."
          head -n 1 output/playlist.m3u | grep -q "^#EXTM3U"

          echo "Verifying playlist-json.m3u contains valid JSON..."
          python3 -c "import json; json.load(open('output/playlist-json.m3u'))"
          echo "All verifications passed successfully!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-playlists
          path: output/
