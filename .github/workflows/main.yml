name: APK Drive Mod Builder

on:
  workflow_dispatch:
    inputs:

      drive_file_id:
        description: "Google Drive APK File ID"
        required: true
        type: string

      new_package:
        description: "New package name"
        required: true
        default: "com.example.modified"
        type: string

      app_name:
        description: "New application name"
        required: true
        default: "Modified App"
        type: string

      language:
        description: "Language"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - bn

      find_text:
        description: "Optional text/code to replace"
        required: false
        default: ""
        type: string

      replace_text:
        description: "Replacement text/code"
        required: false
        default: ""
        type: string


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # CREATE DIRECTORIES
      # ============================================================

      - name: Create directories
        run: |
          set -e

          mkdir -p input
          mkdir -p output
          mkdir -p tools
          mkdir -p translations/bn/values


      # ============================================================
      # DOWNLOAD LATEST APKTOOL
      # ============================================================

      - name: Download latest APKTool
        run: |
          set -e

          echo "Finding latest APKTool release..."

          APKTOOL_URL=$(python3 - <<'PY'
          import json
          import urllib.request

          api = "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          request = urllib.request.Request(
              api,
              headers={
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          found = None

          for asset in data.get("assets", []):

              name = asset.get("name", "").lower()

              if (
                  name.endswith(".jar")
                  and "apktool" in name
              ):
                  found = asset["browser_download_url"]
                  break

          if not found:
              raise SystemExit(
                  "Could not find APKTool JAR in latest release."
              )

          print(found)
          PY
          )

          echo "APKTool URL:"
          echo "$APKTOOL_URL"

          curl \
            -fL \
            --retry 3 \
            --retry-delay 2 \
            -o apktool.jar \
            "$APKTOOL_URL"

          echo ""
          echo "APKTool file:"
          ls -lh apktool.jar

          echo ""
          echo "File type:"
          file apktool.jar

          echo ""
          echo "APKTool version:"
          java -jar apktool.jar --version


      # ============================================================
      # INSTALL GOOGLE DRIVE DOWNLOADER
      # ============================================================

      - name: Install gdown
        run: |
          python -m pip install --upgrade pip
          pip install gdown


      # ============================================================
      # CREATE PACKAGE MODIFIER
      # ============================================================

      - name: Create package modifier
        run: |

          cat > tools/package_modifier.py <<'PYTHON'

          import sys
          import re
          from pathlib import Path


          root = Path(sys.argv[1])
          new_package = sys.argv[2]


          # --------------------------------------------------------
          # Validate package
          # --------------------------------------------------------

          pattern = (
              r'^[A-Za-z_][A-Za-z0-9_]*'
              r'(\.[A-Za-z_][A-Za-z0-9_]*)+$'
          )


          if not re.fullmatch(pattern, new_package):

              print(
                  "ERROR: Invalid package name:",
                  new_package
              )

              sys.exit(1)


          manifest = root / "AndroidManifest.xml"


          if not manifest.exists():

              print(
                  "ERROR: AndroidManifest.xml not found"
              )

              sys.exit(1)


          manifest_text = manifest.read_text(
              encoding="utf-8",
              errors="ignore"
          )


          # --------------------------------------------------------
          # Find old package
          # --------------------------------------------------------

          match = re.search(
              r'\bpackage\s*=\s*"([^"]+)"',
              manifest_text
          )


          if not match:

              print(
                  "WARNING: package attribute not found"
              )

              sys.exit(0)


          old_package = match.group(1)


          print(
              "Old package:",
              old_package
          )


          print(
              "New package:",
              new_package
          )


          if old_package == new_package:

              print(
                  "Package is already the requested value."
              )

              sys.exit(0)


          # --------------------------------------------------------
          # Replace package references
          # --------------------------------------------------------

          changed = 0


          for path in root.rglob("*"):

              if not path.is_file():
                  continue


              try:

                  data = path.read_text(
                      encoding="utf-8"
                  )

              except (
                  UnicodeDecodeError,
                  OSError
              ):

                  continue


              if old_package not in data:
                  continue


              try:

                  new_data = data.replace(
                      old_package,
                      new_package
                  )


                  path.write_text(
                      new_data,
                      encoding="utf-8"
                  )


                  changed += 1


                  print(
                      "Updated:",
                      path
                  )


              except OSError:

                  pass


          # --------------------------------------------------------
          # Update manifest
          # --------------------------------------------------------

          manifest_text = re.sub(
              r'(\bpackage\s*=\s*")[^"]+(")',
              rf'\g<1>{new_package}\g<2>',
              manifest_text,
              count=1
          )


          manifest.write_text(
              manifest_text,
              encoding="utf-8"
          )


          print(
              "Package replacement completed."
          )


          print(
              "Files changed:",
              changed
          )

          PYTHON


      # ============================================================
      # CREATE APP NAME MODIFIER
      # ============================================================

      - name: Create app name modifier
        run: |

          cat > tools/app_name.py <<'PYTHON'

          import sys
          import re
          from pathlib import Path


          root = Path(sys.argv[1])
          app_name = sys.argv[2]


          # --------------------------------------------------------
          # AndroidManifest.xml
          # --------------------------------------------------------

          manifest = root / "AndroidManifest.xml"


          if manifest.exists():

              text = manifest.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )


              # Only replace literal android:label values.
              # Resource references such as @string/app_name
              # are preserved.

              text = re.sub(
                  r'android:label\s*=\s*"(?!(?:@string/))[^"]*"',
                  'android:label="' +
                  app_name.replace('"', '') +
                  '"',
                  text,
                  count=1
              )


              manifest.write_text(
                  text,
                  encoding="utf-8"
              )


          # --------------------------------------------------------
          # strings.xml app_name
          # --------------------------------------------------------

          values = root / "res" / "values"


          if values.exists():

              for xml in values.glob("*.xml"):

                  try:

                      data = xml.read_text(
                          encoding="utf-8"
                      )

                  except UnicodeDecodeError:

                      continue


                  if (
                      'name="app_name"'
                      not in data
                  ):

                      continue


                  escaped = (
                      app_name
                      .replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                  )


                  pattern = (
                      r'(<string\s+'
                      r'name\s*=\s*"app_name"'
                      r'[^>]*>)'
                      r'.*?'
                      r'(</string>)'
                  )


                  data = re.sub(
                      pattern,
                      r'\g<1>' +
                      escaped +
                      r'\g<2>',
                      data,
                      flags=re.DOTALL
                  )


                  xml.write_text(
                      data,
                      encoding="utf-8"
                  )


          print(
              "Application name modification completed."
          )

          PYTHON


      # ============================================================
      # CREATE TEXT PATCHER
      # ============================================================

      - name: Create text patcher
        run: |

          cat > tools/text_patcher.py <<'PYTHON'

          import sys
          from pathlib import Path


          root = Path(sys.argv[1])
          find_text = sys.argv[2]
          replace_text = sys.argv[3]


          if not find_text:

              print(
                  "No custom text patch requested."
              )

              sys.exit(0)


          changed = 0


          for path in root.rglob("*"):

              if not path.is_file():
                  continue


              try:

                  data = path.read_text(
                      encoding="utf-8"
                  )

              except (
                  UnicodeDecodeError,
                  OSError
              ):

                  continue


              if find_text not in data:
                  continue


              new_data = data.replace(
                  find_text,
                  replace_text
              )


              if new_data == data:
                  continue


              try:

                  path.write_text(
                      new_data,
                      encoding="utf-8"
                  )

                  changed += 1

                  print(
                      "Patched:",
                      path
                  )

              except OSError:

                  pass


          print(
              "Files modified:",
              changed
          )

          PYTHON


      # ============================================================
      # CREATE LANGUAGE FILE
      # ============================================================

      - name: Create Bangla translation template
        run: |

          cat > translations/bn/values/strings.xml <<'XML'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <!--
              Add translations for existing resource names.

              Example:

              <string name="app_name">
                  আমার অ্যাপ
              </string>

              <string name="login">
                  লগইন
              </string>

              <string name="settings">
                  সেটিংস
              </string>

              -->

          </resources>

          XML


      # ============================================================
      # CREATE LANGUAGE MODIFIER
      # ============================================================

      - name: Create language modifier
        run: |

          cat > tools/language_modifier.py <<'PYTHON'

          import sys
          from pathlib import Path


          root = Path(sys.argv[1])
          language = sys.argv[2]


          if language == "none":

              print(
                  "Language modification disabled."
              )

              sys.exit(0)


          source = (
              Path("translations")
              / language
              / "values"
          )


          destination = (
              root
              / "res"
              / "values"
          )


          if not source.exists():

              print(
                  "Translation directory not found:",
                  source
              )

              sys.exit(0)


          destination.mkdir(
              parents=True,
              exist_ok=True
          )


          for source_file in source.glob(
              "*.xml"
          ):

              content = source_file.read_text(
                  encoding="utf-8"
              )


              # Do not overwrite resources with
              # an empty template.

              if "<string " not in content:

                  print(
                      "Skipping empty:",
                      source_file
                  )

                  continue


              target = (
                  destination
                  / source_file.name
              )


              target.write_text(
                  content,
                  encoding="utf-8"
              )


              print(
                  "Applied:",
                  source_file
              )


          print(
              "Language modification completed."
          )

          PYTHON


      # ============================================================
      # DOWNLOAD APK FROM GOOGLE DRIVE
      # ============================================================

      - name: Download APK from Google Drive
        env:
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
        run: |

          set -e

          echo "Downloading APK from Google Drive..."

          gdown \
            --id "$DRIVE_FILE_ID" \
            -O input/source.apk


          echo ""
          echo "Downloaded file:"
          ls -lh input/source.apk


          echo ""
          echo "File type:"
          file input/source.apk


          test -s input/source.apk


      # ============================================================
      # VERIFY APK ZIP
      # ============================================================

      - name: Verify APK
        run: |

          python3 - <<'PY'

          import zipfile

          apk = "input/source.apk"

          if not zipfile.is_zipfile(apk):

              raise SystemExit(
                  "ERROR: Downloaded file is not a valid APK/ZIP."
              )

          print(
              "APK ZIP structure looks valid."
          )

          PY


      # ============================================================
      # DECODE APK
      # ============================================================

      - name: Decode APK
        run: |

          set -e

          java \
            -jar apktool.jar \
            d input/source.apk \
            -o decoded \
            --force


      # ============================================================
      # DETECT ORIGINAL PACKAGE
      # ============================================================

      - name: Detect original package
        run: |

          echo "AndroidManifest.xml"

          grep \
            -o \
            'package="[^"]*"' \
            decoded/AndroidManifest.xml \
            || true


      # ============================================================
      # CHANGE PACKAGE
      # ============================================================

      - name: Change package
        env:
          NEW_PACKAGE: ${{ inputs.new_package }}
        run: |

          python3 \
            tools/package_modifier.py \
            decoded \
            "$NEW_PACKAGE"


      # ============================================================
      # CHANGE APP NAME
      # ============================================================

      - name: Change application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |

          python3 \
            tools/app_name.py \
            decoded \
            "$APP_NAME"


      # ============================================================
      # CUSTOM CODE / RESOURCE PATCH
      # ============================================================

      - name: Apply custom patch
        env:
          FIND_TEXT: ${{ inputs.find_text }}
          REPLACE_TEXT: ${{ inputs.replace_text }}
        run: |

          python3 \
            tools/text_patcher.py \
            decoded \
            "$FIND_TEXT" \
            "$REPLACE_TEXT"


      # ============================================================
      # LANGUAGE
      # ============================================================

      - name: Apply language
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |

          python3 \
            tools/language_modifier.py \
            decoded \
            "$LANGUAGE"


      # ============================================================
      # INSPECT MODIFIED PROJECT
      # ============================================================

      - name: Inspect decoded project
        run: |

          echo "================================"
          echo "MANIFEST"
          echo "================================"

          sed -n '1,160p' \
            decoded/AndroidManifest.xml


          echo ""
          echo "================================"
          echo "SMALI DIRECTORIES"
          echo "================================"

          find decoded \
            -type d \
            -name "smali*" \
            | head -50


          echo ""
          echo "================================"
          echo "RESOURCE DIRECTORIES"
          echo "================================"

          if [ -d decoded/res ]; then

            find decoded/res \
              -maxdepth 1 \
              -type d \
              | head -80

          fi


      # ============================================================
      # REBUILD
      # ============================================================

      - name: Rebuild APK
        run: |

          set -e

          java \
            -jar apktool.jar \
            b decoded \
            -o output/unsigned.apk


          echo ""
          echo "Unsigned APK:"
          ls -lh output/unsigned.apk


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # BUILD TOOLS
      # ============================================================

      - name: Install Android build tools
        run: |

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"


      # ============================================================
      # CREATE SIGNING KEY
      # ============================================================

      - name: Create signing key
        run: |

          keytool \
            -genkeypair \
            -v \
            -keystore release.keystore \
            -storepass android \
            -keypass android \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=APK Mod Build"


      # ============================================================
      # SIGN
      # ============================================================

      - name: Sign APK
        run: |

          $ANDROID_HOME/build-tools/35.0.0/apksigner \
            sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/modified.apk \
            output/unsigned.apk


      # ============================================================
      # VERIFY SIGNATURE
      # ============================================================

      - name: Verify signed APK
        run: |

          $ANDROID_HOME/build-tools/35.0.0/apksigner \
            verify \
            --verbose \
            output/modified.apk


          echo ""
          echo "Final APK:"
          ls -lh output/modified.apk


      # ============================================================
      # CREATE DECODED PROJECT ZIP
      # ============================================================

      - name: Create decoded project archive
        run: |

          cd decoded

          zip \
            -r \
            ../output/decoded-project.zip \
            . \
            -x "build/*"


          cd ..


      # ============================================================
      # UPLOAD MODIFIED APK
      # ============================================================

      - name: Upload modified APK
        uses: actions/upload-artifact@v4
        with:
          name: modified-apk
          path: output/modified.apk
          retention-days: 7


      # ============================================================
      # UPLOAD DECODED PROJECT
      # ============================================================

      - name: Upload decoded project
        uses: actions/upload-artifact@v4
        with:
          name: decoded-apk-project
          path: output/decoded-project.zip
          retention-days: 7
