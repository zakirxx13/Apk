name: Authorized APK Mod Builder

on:
  workflow_dispatch:
    inputs:

      apk_url:
        description: "Direct URL of your authorized APK"
        required: true
        type: string

      new_package:
        description: "New package name"
        required: true
        default: "com.example.modified"
        type: string

      app_name:
        description: "New application name"
        required: true
        default: "Modified App"
        type: string

      find_text:
        description: "Text to replace"
        required: false
        default: ""
        type: string

      replace_text:
        description: "Replacement text"
        required: false
        default: ""
        type: string


permissions:
  contents: read


jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # DIRECTORIES
      # ==========================================================

      - name: Create directories
        run: |
          set -e

          mkdir -p input
          mkdir -p output
          mkdir -p tools

          echo "Directories ready."


      # ==========================================================
      # APKTOOL
      # ==========================================================

      - name: Download latest APKTool
        run: |
          set -e

          APKTOOL_URL=$(python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          jar = None

          for asset in data.get("assets", []):
              name = asset.get("name", "").lower()

              if name.endswith(".jar") and "apktool" in name:
                  jar = asset["browser_download_url"]
                  break

          if not jar:
              raise SystemExit(
                  "APKTool JAR not found."
              )

          print(jar)
          PY
          )

          echo "Downloading:"
          echo "$APKTOOL_URL"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$APKTOOL_URL" \
            -o apktool.jar

          test -s apktool.jar

          echo ""
          echo "APKTool:"
          ls -lh apktool.jar

          echo ""
          java -jar apktool.jar --version


      # ==========================================================
      # DOWNLOAD APK
      # ==========================================================

      - name: Download authorized APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -e

          echo "Downloading APK..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "Mozilla/5.0" \
            "$APK_URL" \
            -o input/source.apk

          echo ""
          echo "Downloaded APK:"
          ls -lh input/source.apk

          echo ""
          echo "File type:"
          file input/source.apk

          test -s input/source.apk


      # ==========================================================
      # VERIFY APK
      # ==========================================================

      - name: Verify APK
        run: |
          set -e

          python3 - <<'PY'
          import zipfile

          apk = "input/source.apk"

          if not zipfile.is_zipfile(apk):
              raise SystemExit(
                  "ERROR: Downloaded file is not a valid APK."
              )

          print("Valid APK detected.")
          PY


      # ==========================================================
      # DECODE
      # ==========================================================

      - name: Decode APK
        run: |
          set -e

          echo "Decoding APK..."

          java -jar apktool.jar \
            d input/source.apk \
            -o decoded \
            --force

          echo ""
          echo "Decode completed."


      # ==========================================================
      # DETECT PACKAGE
      # ==========================================================

      - name: Detect package
        run: |
          set -e

          python3 - <<'PY'
          import re

          path = "decoded/AndroidManifest.xml"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = f.read()

          match = re.search(
              r'<manifest[^>]*\bpackage="([^"]+)"',
              data
          )

          if not match:
              raise SystemExit(
                  "Original package not found."
              )

          print(
              "Original package:",
              match.group(1)
          )
          PY


      # ==========================================================
      # PACKAGE MODIFIER
      # ==========================================================

      - name: Create package modifier
        run: |
          cat > tools/package_modifier.py <<'PY'
          import os
          import re

          decoded = "decoded"
          new_package = os.environ["NEW_PACKAGE"]

          if not re.match(
              r"^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$",
              new_package
          ):
              raise SystemExit(
                  "Invalid package name."
              )

          manifest = os.path.join(
              decoded,
              "AndroidManifest.xml"
          )

          with open(
              manifest,
              "r",
              encoding="utf-8"
          ) as f:
              manifest_text = f.read()

          match = re.search(
              r'<manifest[^>]*\bpackage="([^"]+)"',
              manifest_text
          )

          if not match:
              raise SystemExit(
                  "Could not detect old package."
              )

          old_package = match.group(1)

          print(
              "Old package:",
              old_package
          )

          print(
              "New package:",
              new_package
          )

          if old_package == new_package:
              print("Package unchanged.")
              raise SystemExit(0)

          # Replace package references in text files
          for root, dirs, files in os.walk(decoded):

              for filename in files:

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          content = f.read()

                  except (
                      UnicodeDecodeError,
                      PermissionError
                  ):
                      continue

                  if old_package in content:

                      content = content.replace(
                          old_package,
                          new_package
                      )

                      with open(
                          path,
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(content)

          # Manifest
          manifest_text = manifest_text.replace(
              f'package="{old_package}"',
              f'package="{new_package}"',
              1
          )

          with open(
              manifest,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(manifest_text)

          print(
              "Package modification completed."
          )
          PY


      # ==========================================================
      # CHANGE PACKAGE
      # ==========================================================

      - name: Change package
        env:
          NEW_PACKAGE: ${{ inputs.new_package }}
        run: |
          python3 tools/package_modifier.py


      # ==========================================================
      # CHANGE APP NAME
      # ==========================================================

      - name: Change application name
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re

          decoded = "decoded"
          app_name = os.environ["APP_NAME"]

          manifest = os.path.join(
              decoded,
              "AndroidManifest.xml"
          )

          with open(
              manifest,
              "r",
              encoding="utf-8"
          ) as f:
              data = f.read()

          # Change literal android:label
          data = re.sub(
              r'android:label="[^"]*"',
              f'android:label="{app_name}"',
              data,
              count=1
          )

          with open(
              manifest,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data)

          # Change app_name resource if present
          for root, dirs, files in os.walk(
              os.path.join(decoded, "res")
          ):

              for filename in files:

                  if filename != "strings.xml":
                      continue

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          text = f.read()

                  except UnicodeDecodeError:
                      continue

                  new_text = re.sub(
                      r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                      r'\g<1>' + app_name + r'\g<2>',
                      text,
                      flags=re.DOTALL
                  )

                  if new_text != text:

                      with open(
                          path,
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(new_text)

          print(
              "Application name:",
              app_name
          )
          PY


      # ==========================================================
      # TEXT REPLACEMENT
      # ==========================================================

      - name: Replace text
        env:
          FIND_TEXT: ${{ inputs.find_text }}
          REPLACE_TEXT: ${{ inputs.replace_text }}
        run: |
          set -e

          if [ -z "$FIND_TEXT" ]; then
            echo "No text replacement requested."
            exit 0
          fi

          python3 - <<'PY'
          import os

          find_text = os.environ["FIND_TEXT"]
          replace_text = os.environ["REPLACE_TEXT"]

          changed = 0

          for root, dirs, files in os.walk("decoded"):

              for filename in files:

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          data = f.read()

                  except (
                      UnicodeDecodeError,
                      PermissionError
                  ):
                      continue

                  if find_text not in data:
                      continue

                  new_data = data.replace(
                      find_text,
                      replace_text
                  )

                  if new_data != data:

                      with open(
                          path,
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(new_data)

                      changed += 1

          print(
              "Files changed:",
              changed
          )
          PY


      # ==========================================================
      # INSPECT
      # ==========================================================

      - name: Inspect modified project
        run: |
          echo "================================"
          echo "MODIFIED MANIFEST"
          echo "================================"

          grep -m 1 \
            '<manifest' \
            decoded/AndroidManifest.xml || true

          echo ""

          echo "================================"
          echo "SMALI DIRECTORIES"
          echo "================================"

          find decoded \
            -maxdepth 1 \
            -type d \
            -name "smali*" \
            -print || true


      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # BUILD TOOLS
      # ==========================================================

      - name: Install build tools
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"


      # ==========================================================
      # REBUILD
      # ==========================================================

      - name: Rebuild APK
        run: |
          set -e

          java -jar apktool.jar \
            b decoded \
            -o output/unsigned.apk

          test -s output/unsigned.apk

          ls -lh output/unsigned.apk


      # ==========================================================
      # SIGNING KEY
      # ==========================================================

      - name: Create signing key
        run: |
          set -e

          keytool \
            -genkeypair \
            -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Authorized APK Builder, OU=Build, O=Local, L=Dhaka, ST=Dhaka, C=BD"


      # ==========================================================
      # SIGN
      # ==========================================================

      - name: Sign APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/modified.apk \
            output/unsigned.apk

          ls -lh output/modified.apk


      # ==========================================================
      # VERIFY SIGNATURE
      # ==========================================================

      - name: Verify signature
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            output/modified.apk

          echo "Signature verification successful."


      # ==========================================================
      # VERIFY APK
      # ==========================================================

      - name: Verify final APK
        run: |
          set -e

          python3 - <<'PY'
          import zipfile

          apk = "output/modified.apk"

          if not zipfile.is_zipfile(apk):
              raise SystemExit(
                  "Final APK is invalid."
              )

          print("Final APK is valid.")
          PY

          file output/modified.apk


      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload modified APK
        uses: actions/upload-artifact@v4
        with:
          name: modified-apk
          path: output/modified.apk
          if-no-files-found: error


      # ==========================================================
      # ZIP DECODED PROJECT
      # ==========================================================

      - name: Create decoded project archive
        run: |
          set -e

          cd decoded

          zip -qr \
            ../output/decoded-apk-project.zip \
            .

          cd ..

          ls -lh output/decoded-apk-project.zip


      # ==========================================================
      # UPLOAD PROJECT
      # ==========================================================

      - name: Upload decoded project
        uses: actions/upload-artifact@v4
        with:
          name: decoded-apk-project
          path: output/decoded-apk-project.zip
          if-no-files-found: error


      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Summary
        run: |
          echo ""
          echo "============================================"
          echo "             BUILD COMPLETE"
          echo "============================================"
          echo ""
          echo "APK:"
          echo "output/modified.apk"
          echo ""
          echo "Package:"
          echo "${{ inputs.new_package }}"
          echo ""
          echo "App name:"
          echo "${{ inputs.app_name }}"
          echo ""
          echo "Artifacts:"
          echo "  modified-apk"
          echo "  decoded-apk-project"
          echo ""
          echo "============================================"
