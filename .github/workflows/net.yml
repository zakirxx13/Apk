name: APK Static API Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            grep \
            strings \
            file \
            python3

      - name: Download APK
        run: |
          mkdir -p work/apk
          wget \
            --https-only \
            --timeout=60 \
            --tries=3 \
            -O work/apk/app.apk \
            "https://sport-zfy.com/wp-content/apk/Sportzfy_v32.0.apk"

          file work/apk/app.apk
          ls -lh work/apk/app.apk

      - name: Download JADX
        run: |
          mkdir -p work/tools

          wget -q \
            "https://github.com/skylot/jadx/releases/latest/download/jadx-1.5.3.zip" \
            -O work/tools/jadx.zip

          mkdir -p work/tools/jadx
          unzip -q work/tools/jadx.zip -d work/tools/jadx

      - name: Decode APK
        run: |
          mkdir -p work/decoded

          unzip -q \
            work/apk/app.apk \
            -d work/decoded

      - name: Decompile APK
        run: |
          mkdir -p work/source

          ./work/tools/jadx/bin/jadx \
            --output-dir work/source \
            work/apk/app.apk \
            || true

      - name: Extract public URLs
        run: |
          mkdir -p report

          {
            echo "========================================"
            echo "PUBLIC URL / ENDPOINT SCAN"
            echo "========================================"
            echo

            echo "[HTTP / HTTPS]"
            grep -RhoE \
              'https?://[^"'\''<>[:space:]]+' \
              work/source work/decoded 2>/dev/null \
              | sed 's/[),;]$//' \
              | sort -u \
              || true

            echo
            echo "[WEBSOCKET]"
            grep -RhoE \
              'wss?://[^"'\''<>[:space:]]+' \
              work/source work/decoded 2>/dev/null \
              | sed 's/[),;]$//' \
              | sort -u \
              || true

            echo
            echo "[API-LIKE PATHS]"
            grep -RhoE \
              '["'\''][^"'\'']*/(api|api/v[0-9]+|v[0-9]+|graphql|rest)/[^"'\'']*["'\'']' \
              work/source work/decoded 2>/dev/null \
              | sort -u \
              || true

          } > report/public-endpoints.txt

      - name: Extract hostnames
        run: |
          {
            echo
            echo "========================================"
            echo "HOSTNAMES"
            echo "========================================"
            echo

            grep -RhoE \
              'https?://[^/"'\''<>[:space:]]+' \
              work/source work/decoded 2>/dev/null \
              | sed -E 's#https?://##' \
              | sort -u \
              || true

          } >> report/public-endpoints.txt

      - name: Search networking libraries
        run: |
          {
            echo
            echo "========================================"
            echo "NETWORKING TECHNOLOGY REFERENCES"
            echo "========================================"
            echo

            grep -RniE \
              'Retrofit|OkHttp|Volley|HttpURLConnection|WebView|GraphQL|Firebase|Supabase' \
              work/source 2>/dev/null \
              | head -n 500 \
              || true

          } > report/networking.txt

      - name: Inspect native libraries
        run: |
          {
            echo
            echo "========================================"
            echo "NATIVE LIBRARY PUBLIC URL SCAN"
            echo "========================================"
            echo

            find work/decoded \
              -type f \
              -name "*.so" \
              -print0 |
            while IFS= read -r -d '' lib; do
              echo
              echo "--- $lib ---"

              strings "$lib" 2>/dev/null |
                grep -E \
                  'https?://|wss?://|/api/|/v[0-9]+/' |
                sort -u \
                || true
            done

          } > report/native-libraries.txt

      - name: APK information
        run: |
          {
            echo "========================================"
            echo "APK INFORMATION"
            echo "========================================"
            echo

            file work/apk/app.apk

            echo
            echo "APK SIZE:"
            du -h work/apk/app.apk

            echo
            echo "TOP-LEVEL CONTENT:"
            find work/decoded \
              -maxdepth 2 \
              -type f |
              sort |
              head -n 300

          } > report/apk-info.txt

      - name: Create combined report
        run: |
          cat \
            report/apk-info.txt \
            report/public-endpoints.txt \
            report/networking.txt \
            report/native-libraries.txt \
            > report/FINAL-REPORT.txt

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: apk-static-api-report
          path: report/
          retention-days: 7

      - name: Print report summary
        run: |
          echo "========================================"
          echo "SCAN COMPLETE"
          echo "========================================"
          echo
          cat report/public-endpoints.txt
