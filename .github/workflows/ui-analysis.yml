name: Analyze APK UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check decompiled APK
        run: |
          if [ ! -d "report" ]; then
            echo "ERROR: report/ directory not found."
            exit 1
          fi

          if [ ! -f "report/AndroidManifest.xml" ]; then
            echo "ERROR: report/AndroidManifest.xml not found."
            exit 1
          fi

          echo "Decompiled APK found."

      - name: Create UI analyzer
        run: |
          cat > ui_analyzer.py <<'PY'
          import os
          import re
          import html
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict

          ROOT = Path("report")
          OUTPUT = Path("UI_ANALYSIS.md")

          ANDROID_NS = "http://schemas.android.com/apk/res/android"

          def android_attr(element, name):
              return element.attrib.get(
                  "{%s}%s" % (ANDROID_NS, name)
              )

          def safe_read(path):
              try:
                  return path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  return ""

          def clean_text(value):
              if value is None:
                  return ""
              value = html.unescape(value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def short_text(value, limit=120):
              value = clean_text(value)
              if len(value) > limit:
                  return value[:limit - 3] + "..."
              return value

          # ---------------------------------------------------------
          # Manifest
          # ---------------------------------------------------------

          manifest_path = ROOT / "AndroidManifest.xml"

          manifest_package = "Unknown"
          app_label = ""
          app_theme = ""
          app_icon = ""
          activities = []

          try:
              tree = ET.parse(manifest_path)
              manifest_root = tree.getroot()

              manifest_package = manifest_root.attrib.get(
                  "package",
                  "Unknown"
              )

              application = manifest_root.find("application")

              if application is not None:
                  app_label = android_attr(application, "label") or ""
                  app_theme = android_attr(application, "theme") or ""
                  app_icon = android_attr(application, "icon") or ""

              for activity in manifest_root.iter():
                  tag = activity.tag.split("}")[-1]

                  if tag != "activity":
                      continue

                  name = android_attr(activity, "name")

                  if not name:
                      continue

                  exported = android_attr(activity, "exported")
                  label = android_attr(activity, "label")
                  theme = android_attr(activity, "theme")

                  activities.append({
                      "name": name,
                      "exported": exported or "",
                      "label": label or "",
                      "theme": theme or ""
                  })

          except Exception as e:
              manifest_package = "Manifest parse error: " + str(e)

          # ---------------------------------------------------------
          # Resource inventory
          # ---------------------------------------------------------

          layouts = []
          drawables = []
          mipmaps = []
          value_files = []
          xml_resources = []
          raw_files = []
          fonts = []

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              parts = path.parts
              name = path.name.lower()

              if any(p.startswith("layout") for p in parts):
                  if path.suffix.lower() == ".xml":
                      layouts.append(path)

              if any(p.startswith("drawable") for p in parts):
                  drawables.append(path)

              if any(p.startswith("mipmap") for p in parts):
                  mipmaps.append(path)

              if any(p.startswith("values") for p in parts):
                  if path.suffix.lower() == ".xml":
                      value_files.append(path)

              if any(p.startswith("xml") for p in parts):
                  if path.suffix.lower() == ".xml":
                      xml_resources.append(path)

              if any(p.startswith("raw") for p in parts):
                  raw_files.append(path)

              if any(p.startswith("font") for p in parts):
                  fonts.append(path)

          layouts.sort()
          drawables.sort()
          mipmaps.sort()
          value_files.sort()
          xml_resources.sort()
          raw_files.sort()
          fonts.sort()

          # ---------------------------------------------------------
          # Parse values
          # ---------------------------------------------------------

          strings = {}
          colors = {}
          dimens = {}
          styles = {}
          themes = {}
          ids = set()

          for path in value_files:

              text = safe_read(path)

              # strings
              for match in re.finditer(
                  r"<string\b[^>]*\bname\s*=\s*['\"]([^'\"]+)['\"][^>]*>(.*?)</string>",
                  text,
                  re.S | re.I
              ):
                  name = match.group(1)
                  value = re.sub("<[^>]+>", "", match.group(2))
                  value = short_text(value)
                  strings[name] = value

              # colors
              for match in re.finditer(
                  r"<color\b[^>]*\bname\s*=\s*['\"]([^'\"]+)['\"][^>]*>(.*?)</color>",
                  text,
                  re.S | re.I
              ):
                  name = match.group(1)
                  value = clean_text(
                      re.sub("<[^>]+>", "", match.group(2))
                  )
                  colors[name] = value

              # dimens
              for match in re.finditer(
                  r"<dimen\b[^>]*\bname\s*=\s*['\"]([^'\"]+)['\"][^>]*>(.*?)</dimen>",
                  text,
                  re.S | re.I
              ):
                  name = match.group(1)
                  value = clean_text(
                      re.sub("<[^>]+>", "", match.group(2))
                  )
                  dimens[name] = value

              # styles
              for match in re.finditer(
                  r"<style\b([^>]*)>",
                  text,
                  re.I
              ):
                  attrs = match.group(1)

                  name_match = re.search(
                      r"\bname\s*=\s*['\"]([^'\"]+)['\"]",
                      attrs
                  )

                  if not name_match:
                      continue

                  style_name = name_match.group(1)

                  parent_match = re.search(
                      r"\bparent\s*=\s*['\"]([^'\"]+)['\"]",
                      attrs
                  )

                  parent = (
                      parent_match.group(1)
                      if parent_match
                      else ""
                  )

                  styles[style_name] = parent

                  if (
                      style_name.lower().startswith("theme")
                      or "theme" in style_name.lower()
                  ):
                      themes[style_name] = parent

              # ids
              for match in re.finditer(
                  r"<item\b[^>]*\btype\s*=\s*['\"]id['\"][^>]*\bname\s*=\s*['\"]([^'\"]+)['\"]",
                  text,
                  re.I
              ):
                  ids.add(match.group(1))

          # ---------------------------------------------------------
          # Layout analysis
          # ---------------------------------------------------------

          layout_data = []
          layout_reference_count = Counter()
          layout_references = defaultdict(list)

          view_counter = Counter()
          id_counter = Counter()
          drawable_refs = Counter()
          color_refs = Counter()
          string_refs = Counter()

          def xml_tag_name(tag):
              return tag.split("}")[-1]

          for path in layouts:

              data = {
                  "path": str(path),
                  "name": path.stem,
                  "size": path.stat().st_size,
                  "root": "",
                  "views": [],
                  "ids": [],
                  "texts": [],
                  "drawables": [],
                  "colors": [],
                  "strings": [],
                  "includes": []
              }

              text = safe_read(path)

              # Resource references
              for match in re.findall(
                  r"@layout/([A-Za-z0-9_]+)",
                  text
              ):
                  data["includes"].append(match)

              for match in re.findall(
                  r"@drawable/([A-Za-z0-9_]+)|@mipmap/([A-Za-z0-9_]+)",
                  text
              ):
                  ref = match[0] or match[1]
                  if ref:
                      data["drawables"].append(ref)
                      drawable_refs[ref] += 1

              for match in re.findall(
                  r"@color/([A-Za-z0-9_]+)",
                  text
              ):
                  data["colors"].append(match)
                  color_refs[match] += 1

              for match in re.findall(
                  r"@string/([A-Za-z0-9_]+)",
                  text
              ):
                  data["strings"].append(match)
                  string_refs[match] += 1

              try:
                  tree = ET.parse(path)
                  root = tree.getroot()

                  data["root"] = xml_tag_name(root.tag)

                  for element in root.iter():

                      tag = xml_tag_name(element.tag)

                      if tag not in ("include", "merge"):
                          view_counter[tag] += 1
                          data["views"].append(tag)

                      view_id = android_attr(element, "id")

                      if view_id:
                          clean_id = re.sub(
                              r"^@\+?id/",
                              "",
                              view_id
                          )

                          if clean_id:
                              data["ids"].append(clean_id)
                              id_counter[clean_id] += 1

                      text_attr = android_attr(element, "text")

                      if text_attr:
                          data["texts"].append(
                              short_text(text_attr)
                          )

                      src = android_attr(element, "src")

                      if src:
                          data["drawables"].append(src)

                      background = android_attr(
                          element,
                          "background"
                      )

                      if background:
                          data["drawables"].append(background)

              except Exception:
                  # APKTool XML can occasionally contain malformed
                  # constructs. Regex analysis above still works.
                  pass

              layout_data.append(data)

          # ---------------------------------------------------------
          # Scan decompiled source / smali / xml references
          # ---------------------------------------------------------

          source_extensions = {
              ".smali",
              ".java",
              ".kt",
              ".xml",
              ".txt"
          }

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              if path.suffix.lower() not in source_extensions:
                  continue

              text = safe_read(path)

              # R.layout.foo
              for match in re.finditer(
                  r"R\.layout\.([A-Za-z0-9_]+)",
                  text
              ):
                  layout_name = match.group(1)

                  layout_reference_count[layout_name] += 1

                  if len(layout_references[layout_name]) < 10:
                      layout_references[layout_name].append(
                          str(path)
                      )

              # setContentView(R.layout.foo)
              for match in re.finditer(
                  r"setContentView\s*\(\s*(?:[A-Za-z0-9_]+\.)?R\.layout\.([A-Za-z0-9_]+)",
                  text
              ):
                  layout_name = match.group(1)

                  if str(path) not in layout_references[
                      layout_name
                  ]:
                      layout_references[layout_name].append(
                          str(path)
                      )

              # inflate(R.layout.foo)
              for match in re.finditer(
                  r"inflate\s*\(\s*(?:[A-Za-z0-9_]+\.)?R\.layout\.([A-Za-z0-9_]+)",
                  text
              ):
                  layout_name = match.group(1)

                  layout_reference_count[layout_name] += 1

                  if str(path) not in layout_references[
                      layout_name
                  ]:
                      layout_references[layout_name].append(
                          str(path)
                      )

          # ---------------------------------------------------------
          # Build layout name map
          # ---------------------------------------------------------

          layout_map = {}

          for path in layouts:
              layout_map.setdefault(
                  path.stem,
                  []
              ).append(str(path))

          # ---------------------------------------------------------
          # Activity source matching
          # ---------------------------------------------------------

          activity_layouts = defaultdict(set)

          for activity in activities:

              full_name = activity["name"]

              simple_name = full_name.split(".")[-1]

              possible_files = []

              for ext in (
                  ".smali",
                  ".java",
                  ".kt"
              ):
                  possible_files.extend(
                      ROOT.rglob(simple_name + ext)
                  )

              # Also look for smali class path
              for path in ROOT.rglob("*.smali"):
                  if (
                      path.stem == simple_name
                      or (
                          "$" not in simple_name
                          and path.stem.startswith(
                              simple_name + "$"
                          )
                      )
                  ):
                      possible_files.append(path)

              seen = set()

              for source in possible_files:

                  source = Path(source)

                  if str(source) in seen:
                      continue

                  seen.add(str(source))

                  text = safe_read(source)

                  for match in re.finditer(
                      r"R\.layout\.([A-Za-z0-9_]+)",
                      text
                  ):
                      activity_layouts[
                          full_name
                      ].add(
                          match.group(1)
                      )

                  # Smali form:
                  # Lapp/.../R$layout;->activity_main:I
                  for match in re.finditer(
                      r"R\$layout;->([A-Za-z0-9_]+):I",
                      text
                  ):
                      activity_layouts[
                          full_name
                      ].add(
                          match.group(1)
                      )

          # ---------------------------------------------------------
          # UI indicators
          # ---------------------------------------------------------

          all_source_text = ""

          for path in ROOT.rglob("*"):

              if not path.is_file():
                  continue

              if path.suffix.lower() in (
                  ".smali",
                  ".java",
                  ".kt",
                  ".xml"
              ):
                  all_source_text += "\n" + safe_read(path)

          indicators = {
              "WebView": len(re.findall(
                  r"\bWebView\b",
                  all_source_text,
                  re.I
              )),
              "RecyclerView": len(re.findall(
                  r"RecyclerView",
                  all_source_text,
                  re.I
              )),
              "ViewPager": len(re.findall(
                  r"ViewPager",
                  all_source_text,
                  re.I
              )),
              "Compose": len(re.findall(
                  r"androidx\.compose|setContent\s*\(",
                  all_source_text,
                  re.I
              )),
              "CustomView": len(re.findall(
                  r"extends\s+View\b|extends\s+ViewGroup\b",
                  all_source_text,
                  re.I
              )),
              "BottomNavigation": len(re.findall(
                  r"BottomNavigation|BottomNavigationView",
                  all_source_text,
                  re.I
              )),
              "Toolbar": len(re.findall(
                  r"\bToolbar\b",
                  all_source_text,
                  re.I
              )),
              "Material": len(re.findall(
                  r"com\.google\.android\.material",
                  all_source_text,
                  re.I
              ))
          }

          # ---------------------------------------------------------
          # Generate report
          # ---------------------------------------------------------

          lines = []

          lines.append("# APK UI Analysis")
          lines.append("")
          lines.append(
              "> Automatically generated from the decompiled APK in `report/`."
          )
          lines.append("")
          lines.append("## Application")
          lines.append("")
          lines.append(f"- **Package:** `{manifest_package}`")
          lines.append(
              f"- **Application label:** `{app_label or 'Unknown'}`"
          )
          lines.append(
              f"- **Application theme:** `{app_theme or 'Unknown'}`"
          )
          lines.append(
              f"- **Application icon:** `{app_icon or 'Unknown'}`"
          )
          lines.append("")

          # Summary
          lines.append("## UI Resource Summary")
          lines.append("")
          lines.append(
              f"- Layout XML files: **{len(layouts)}**"
          )
          lines.append(
              f"- Drawable files: **{len(drawables)}**"
          )
          lines.append(
              f"- Mipmap files: **{len(mipmaps)}**"
          )
          lines.append(
              f"- Values XML files: **{len(value_files)}**"
          )
          lines.append(
              f"- XML resources: **{len(xml_resources)}**"
          )
          lines.append(
              f"- Raw resources: **{len(raw_files)}**"
          )
          lines.append(
              f"- Font resources: **{len(fonts)}**"
          )
          lines.append("")

          # Activities
          lines.append("## Activities")
          lines.append("")

          if not activities:
              lines.append("No activities could be parsed.")
          else:
              lines.append(
                  "| Activity | Label | Theme | Exported | Detected Layouts |"
              )
              lines.append(
                  "|---|---|---|---|---|"
              )

              for activity in activities:

                  name = activity["name"]

                  detected = sorted(
                      activity_layouts.get(
                          name,
                          set()
                      )
                  )

                  detected_text = (
                      ", ".join(
                          f"`{x}`"
                          for x in detected
                      )
                      if detected
                      else "-"
                  )

                  lines.append(
                      f"| `{name}` | "
                      f"{activity['label'] or '-'} | "
                      f"`{activity['theme'] or '-'}` | "
                      f"{activity['exported'] or '-'} | "
                      f"{detected_text} |"
                  )

          lines.append("")

          # Layout references
          lines.append("## Layout → Source References")
          lines.append("")

          referenced_layouts = sorted(
              layout_reference_count.items(),
              key=lambda x: (-x[1], x[0])
          )

          if not referenced_layouts:
              lines.append(
                  "No direct `R.layout.*` references were detected."
              )
          else:
              lines.append(
                  "| Layout | References | Source Files | Actual XML |"
              )
              lines.append(
                  "|---|---:|---|---|"
              )

              for layout_name, count in referenced_layouts:

                  source_files = layout_references.get(
                      layout_name,
                      []
                  )

                  source_text = "<br>".join(
                      f"`{x}`"
                      for x in source_files[:5]
                  )

                  actual = layout_map.get(
                      layout_name,
                      []
                  )

                  actual_text = "<br>".join(
                      f"`{x}`"
                      for x in actual
                  ) or "Not found"

                  lines.append(
                      f"| `{layout_name}` | "
                      f"{count} | "
                      f"{source_text or '-'} | "
                      f"{actual_text} |"
                  )

          lines.append("")

          # Detailed layouts
          lines.append("## Layout Files")
          lines.append("")

          for data in sorted(
              layout_data,
              key=lambda x: x["name"]
          ):

              lines.append(
                  f"### `{data['name']}`"
              )
              lines.append("")
              lines.append(
                  f"- **Path:** `{data['path']}`"
              )
              lines.append(
                  f"- **Size:** {data['size']} bytes"
              )
              lines.append(
                  f"- **Root:** `{data['root'] or 'Unknown'}`"
              )

              refs = layout_reference_count.get(
                  data["name"],
                  0
              )

              lines.append(
                  f"- **Source references:** {refs}"
              )

              if data["views"]:
                  unique_views = Counter(
                      data["views"]
                  )

                  view_text = ", ".join(
                      f"`{name}` × {count}"
                      for name, count in unique_views.most_common(30)
                  )

                  lines.append(
                      f"- **Views:** {view_text}"
                  )

              if data["ids"]:
                  id_text = ", ".join(
                      f"`{x}`"
                      for x in data["ids"][:50]
                  )

                  lines.append(
                      f"- **View IDs:** {id_text}"
                  )

              if data["texts"]:
                  text_text = ", ".join(
                      f"`{x}`"
                      for x in data["texts"][:20]
                  )

                  lines.append(
                      f"- **Text attributes:** {text_text}"
                  )

              if data["drawables"]:
                  drawable_text = ", ".join(
                      f"`{x}`"
                      for x in data["drawables"][:30]
                  )

                  lines.append(
                      f"- **Drawable/background refs:** {drawable_text}"
                  )

              if data["colors"]:
                  color_text = ", ".join(
                      f"`{x}`"
                      for x in data["colors"][:30]
                  )

                  lines.append(
                      f"- **Color refs:** {color_text}"
                  )

              if data["strings"]:
                  string_text = ", ".join(
                      f"`{x}`"
                      for x in data["strings"][:30]
                  )

                  lines.append(
                      f"- **String refs:** {string_text}"
                  )

              if data["includes"]:
                  include_text = ", ".join(
                      f"`{x}`"
                      for x in data["includes"]
                  )

                  lines.append(
                      f"- **Included layouts:** {include_text}"
                  )

              lines.append("")

          # Values
          lines.append("## Colors")
          lines.append("")

          if colors:
              lines.append("| Name | Value |")
              lines.append("|---|---|")

              for name, value in sorted(
                  colors.items()
              ):
                  lines.append(
                      f"| `{name}` | `{value}` |"
                  )
          else:
              lines.append("No colors detected.")

          lines.append("")

          lines.append("## Strings")
          lines.append("")

          if strings:
              lines.append("| Name | Value |")
              lines.append("|---|---|")

              for name, value in sorted(
                  strings.items()
              ):
                  lines.append(
                      f"| `{name}` | {value or '-'} |"
                  )
          else:
              lines.append("No strings detected.")

          lines.append("")

          lines.append("## Dimensions")
          lines.append("")

          if dimens:
              lines.append("| Name | Value |")
              lines.append("|---|---|")

              for name, value in sorted(
                  dimens.items()
              ):
                  lines.append(
                      f"| `{name}` | `{value}` |"
                  )
          else:
              lines.append("No dimensions detected.")

          lines.append("")

          lines.append("## Styles")
          lines.append("")

          if styles:
              lines.append("| Style | Parent |")
              lines.append("|---|---|")

              for name, parent in sorted(
                  styles.items()
              ):
                  lines.append(
                      f"| `{name}` | `{parent or '-'}` |"
                  )
          else:
              lines.append("No styles detected.")

          lines.append("")

          lines.append("## Themes")
          lines.append("")

          if themes:
              lines.append("| Theme | Parent |")
              lines.append("|---|---|")

              for name, parent in sorted(
                  themes.items()
              ):
                  lines.append(
                      f"| `{name}` | `{parent or '-'}` |"
                  )
          else:
              lines.append("No themes detected.")

          lines.append("")

          # UI components
          lines.append("## Detected UI Components")
          lines.append("")
          lines.append("| Component | Occurrences |")
          lines.append("|---|---:|")

          for name, count in sorted(
              indicators.items(),
              key=lambda x: (-x[1], x[0])
          ):
              lines.append(
                  f"| `{name}` | {count} |"
              )

          lines.append("")

          # View types
          lines.append("## Most Common View Types")
          lines.append("")

          lines.append("| View | Count |")
          lines.append("|---|---:|")

          for name, count in view_counter.most_common(50):
              lines.append(
                  f"| `{name}` | {count} |"
              )

          lines.append("")

          # Drawables
          lines.append("## Drawable / Image Resources")
          lines.append("")

          if drawables:
              for path in drawables:
                  lines.append(
                      f"- `{path}`"
                  )
          else:
              lines.append(
                  "No drawable resources detected."
              )

          lines.append("")

          # Mipmap
          lines.append("## Mipmap Resources")
          lines.append("")

          if mipmaps:
              for path in mipmaps:
                  lines.append(
                      f"- `{path}`"
                  )
          else:
              lines.append(
                  "No mipmap resources detected."
              )

          lines.append("")

          # Fonts
          lines.append("## Font Resources")
          lines.append("")

          if fonts:
              for path in fonts:
                  lines.append(
                      f"- `{path}`"
                  )
          else:
              lines.append(
                  "No font resources detected."
              )

          lines.append("")

          # Important IDs
          lines.append("## Frequently Used View IDs")
          lines.append("")

          if id_counter:
              lines.append("| ID | Occurrences |")
              lines.append("|---|---:|")

              for name, count in id_counter.most_common(100):
                  lines.append(
                      f"| `{name}` | {count} |"
                  )
          else:
              lines.append(
                  "No view IDs detected."
              )

          lines.append("")

          # Recommended edit targets
          lines.append("## Recommended UI Edit Targets")
          lines.append("")

          ranked_layouts = sorted(
              layout_data,
              key=lambda x: (
                  -layout_reference_count.get(
                      x["name"],
                      0
                  ),
                  -len(x["views"]),
                  x["name"]
              )
          )

          if ranked_layouts:
              lines.append(
                  "The following layouts are good candidates to inspect first:"
              )
              lines.append("")

              for index, data in enumerate(
                  ranked_layouts[:20],
                  1
              ):

                  refs = layout_reference_count.get(
                      data["name"],
                      0
                  )

                  lines.append(
                      f"{index}. `{data['path']}` "
                      f"— {refs} source reference(s), "
                      f"{len(data['views'])} detected view(s)"
                  )
          else:
              lines.append(
                  "No layout candidates were detected."
              )

          lines.append("")

          lines.append("## Important Notes")
          lines.append("")
          lines.append(
              "- This report only analyzes the decompiled files."
          )
          lines.append(
              "- A screen may be created programmatically and therefore have no XML layout."
          )
          lines.append(
              "- Some UI may come from WebView, custom View classes, Jetpack Compose, or native code."
          )
          lines.append(
              "- Activity → layout mappings are reported only when references can be detected."
          )
          lines.append(
              "- Before rebuilding or distributing a modified APK, make sure you have permission to modify and use the original application."
          )
          lines.append("")

          OUTPUT.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("Created:", OUTPUT)
          print("Layouts:", len(layouts))
          print("Drawables:", len(drawables))
          print("Activities:", len(activities))
          print("Strings:", len(strings))
          print("Colors:", len(colors))
          print("Styles:", len(styles))
          print("Themes:", len(themes))

          PY

      - name: Run UI analysis
        run: |
          python3 ui_analyzer.py

      - name: Show report summary
        run: |
          echo "===== UI ANALYSIS SUMMARY ====="
          sed -n '1,220p' UI_ANALYSIS.md

      - name: Commit UI analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add UI_ANALYSIS.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add APK UI analysis report"
          git push
